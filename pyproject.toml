[project]
name = "model-runtime"
version = "0.2.1"
description = "A provider-independent, async LLM invocation runtime"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
aiohttp = [
    "anthropic[aiohttp]>=0.120.2,<1.0.0",
    "openai[aiohttp]>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pydantic>=2.13.4,<3.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests", "example.py"]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
enable_error_code = ["explicit-override"]
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true

[tool.ty.src]
include = ["src", "tests", "example.py"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "I",
    "PTH",
    "N",
    "D",
    "C4",
    "ANN",
    "PYI",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
